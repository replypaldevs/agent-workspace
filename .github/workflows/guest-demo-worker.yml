name: Guest Demo Worker

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: OpenSSH public key authorized for runner access
        required: false
        type: string
      lolgames_ssh_name:
        description: Stable agentsweb SSH hostname prefix
        required: false
        type: string
      lolgames_ssh_port:
        description: Stable agentsweb SSH public port
        required: false
        type: string
      lolgames_tunnel_prefix:
        description: Stable Worker Agents agentsweb prefix
        required: false
        type: string
      demo_lifetime_seconds:
        description: Demo worker lifetime in seconds. Default 18000 (5h).
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: guest-demo-worker-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guest-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Worker Agents
        uses: actions/checkout@v4
        with:
          repository: replypaldevs/workerAgents
          ref: main
          path: workerAgents

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start SSH over agentsweb
        id: lolgames_ssh
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server tmux

          mkdir -p ~/.ssh /tmp/lolgames-ssh
          chmod 700 ~/.ssh
          if [[ -n "${{ inputs.ssh_public_key }}" ]]; then
            printf '%s\n' "${{ inputs.ssh_public_key }}" >> ~/.ssh/authorized_keys
          fi
          chmod 600 ~/.ssh/authorized_keys

          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=no -o PermitRootLogin=no -o PubkeyAuthentication=yes

          for _ in {1..20}; do
            if ss -ltn | grep -q ':2222 '; then
              break
            fi
            sleep 1
          done
          ss -ltn | grep -q ':2222 '

          PUBLIC_NAME="${{ inputs.lolgames_ssh_name }}"
          if [[ -z "$PUBLIC_NAME" ]]; then
            PUBLIC_NAME="guest-demo-${GITHUB_RUN_ID}-ssh"
          fi

          PUBLIC_PORT="${{ inputs.lolgames_ssh_port }}"
          if [[ -z "$PUBLIC_PORT" ]]; then
            PUBLIC_PORT="$((30000 + (GITHUB_RUN_ID % 20000)))"
          fi

          TUNNEL_PREFIX="${{ inputs.lolgames_tunnel_prefix }}"
          if [[ -z "$TUNNEL_PREFIX" ]]; then
            TUNNEL_PREFIX="${PUBLIC_NAME%-ssh}"
          fi

          nohup env LOLGAMES_TUNNEL_RUN_ID="$GITHUB_RUN_ID" PYTHONPATH="$GITHUB_WORKSPACE" python3 -m lolgames_tunnel client 127.0.0.1:2222 \
            --server agentsweb.space \
            --name "$PUBLIC_NAME" \
            --public-port "$PUBLIC_PORT" \
            > /tmp/lolgames-ssh/tunnel.log 2>&1 &
          TUNNEL_PID=$!

          for _ in {1..30}; do
            if grep -q "agentsweb.space" /tmp/lolgames-ssh/tunnel.log; then
              break
            fi
            sleep 1
          done
          grep -q "agentsweb.space" /tmp/lolgames-ssh/tunnel.log

          HOST="${PUBLIC_NAME}.agentsweb.space"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ./id_ed25519 -p ${PUBLIC_PORT} runner@${HOST}"
          WEB_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "$SSH_CMD"
            echo "$WEB_URL"
            echo "host=$HOST"
            echo "port=$PUBLIC_PORT"
            echo "lolgames_tunnel_prefix=$TUNNEL_PREFIX"
          } > /tmp/ssh-link.txt

          {
            echo "host=$HOST"
            echo "port=$PUBLIC_PORT"
            echo "lolgames_tunnel_prefix=$TUNNEL_PREFIX"
            echo "ssh_target=runner@${HOST}:${PUBLIC_PORT}"
            echo "sshd_ready=yes"
            echo "runner_name=$(hostname)"
            echo "tunnel_pid=$TUNNEL_PID"
            echo "tunnel_log_tail<<EOF"
            tail -n 20 /tmp/lolgames-ssh/tunnel.log || true
            echo "EOF"
          } > /tmp/ssh-status.txt

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PUBLIC_PORT" >> "$GITHUB_OUTPUT"
          echo "public_name=$PUBLIC_NAME" >> "$GITHUB_OUTPUT"
          echo "lolgames_tunnel_prefix=$TUNNEL_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Upload SSH link as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-link
          path: /tmp/ssh-link.txt
          if-no-files-found: error

      - name: Upload SSH status artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-status
          path: /tmp/ssh-status.txt
          if-no-files-found: error

      - name: Start Worker Agents demo
        id: worker_agents
        shell: bash
        env:
          FRP_AUTH_TOKEN: ${{ secrets.FRP_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          APP_PORT=1456
          TUNNEL_PREFIX="${{ steps.lolgames_ssh.outputs.lolgames_tunnel_prefix }}"
          LIFETIME="${{ inputs.demo_lifetime_seconds }}"
          if [[ -z "$LIFETIME" ]]; then
            LIFETIME=18000
          fi
          RENEW_AFTER=$(( LIFETIME * 70 / 100 ))
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXPIRES_AT="$(date -u -d "@$(( $(date +%s) + LIFETIME ))" +%Y-%m-%dT%H:%M:%SZ)"
          RENEW_AT="$(date -u -d "@$(( $(date +%s) + RENEW_AFTER ))" +%Y-%m-%dT%H:%M:%SZ)"
          export APP_PORT
          export LOLGAMES_TUNNEL_PREFIX="$TUNNEL_PREFIX"
          export WORKER_APP_SOURCE_DIR="$GITHUB_WORKSPACE/workerAgents"
          export TUNNEL_CLIENT_PATH="$GITHUB_WORKSPACE/lolgames_tunnel"
          export FRP_TUNNEL_CLIENT_PATH="$GITHUB_WORKSPACE/scripts/frp-tunnel.sh"
          export START_CHILD_AGENTS=0
          export INSTALL_CHILD_DEPS=0
          export PROVISION_TRACE=1
          export RUN_TOKEN="guest-demo"
          export LOLGAMES_TUNNEL_EXPIRES_AT="$EXPIRES_AT"
          # Demo workers install and start every agent automatically on server boot.
          export AGENT_AUTO_START_ALL=1
          bash "$GITHUB_WORKSPACE/scripts/provision-worker-runtime.sh" | tee /tmp/worker-provision.log

          STATE_JSON="$HOME/.worker-agents/state.json"
          test -f "$STATE_JSON"
          WORKER_URL="$(python3 - "$STATE_JSON" <<'PY'
          import json, sys
          print((json.load(open(sys.argv[1], encoding='utf-8')).get('worker_agents_url') or '').strip())
          PY
          )"
          if [[ -z "$WORKER_URL" ]]; then
            echo "Guest demo worker URL missing after provision" >&2
            exit 1
          fi
          python3 - "$STATE_JSON" /tmp/guest-demo-metadata.json <<PY
          import json, sys

          state_path, out_path = sys.argv[1:]
          with open(state_path, encoding="utf-8") as fh:
              payload = json.load(fh)
          payload.update({
              "run_id": "${GITHUB_RUN_ID}",
              "started_at": "$STARTED_AT",
              "expires_at": "$EXPIRES_AT",
              "renew_at": "$RENEW_AT",
              "demo_lifetime_seconds": $LIFETIME,
              "renew_after_seconds": $RENEW_AFTER,
          })
          with open(state_path, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
              fh.write("\n")
          with open(out_path, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
              fh.write("\n")
          PY

          echo "worker_agents_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "demo_lifetime_seconds=$LIFETIME" >> "$GITHUB_OUTPUT"
          echo "renew_after_seconds=$RENEW_AFTER" >> "$GITHUB_OUTPUT"
          echo "Guest demo Worker Agents: $WORKER_URL"

      - name: Upload guest demo metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-demo-metadata
          path: /tmp/guest-demo-metadata.json
          if-no-files-found: error

      - name: Wait until renewal point
        shell: bash
        run: |
          set -euo pipefail
          sleep "${{ steps.worker_agents.outputs.renew_after_seconds }}"

      - name: Dispatch successor run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json
          payload = {
              "ref": "${{ github.ref_name }}",
              "inputs": {
                  "ssh_public_key": """${{ inputs.ssh_public_key }}""".strip(),
                  "demo_lifetime_seconds": """${{ steps.worker_agents.outputs.demo_lifetime_seconds }}""".strip(),
              },
          }
          print(json.dumps(payload))
          PY
          )"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/guest-demo-worker.yml/dispatches" \
            -d "$payload"
          date -u +%Y-%m-%dT%H:%M:%SZ >/tmp/guest-demo-renewal.txt

      - name: Upload renewal status artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-demo-renewal
          path: /tmp/guest-demo-renewal.txt
          if-no-files-found: error

      - name: Keep alive until reset
        shell: bash
        run: |
          set -euo pipefail
          lifetime="${{ steps.worker_agents.outputs.demo_lifetime_seconds }}"
          renew_after="${{ steps.worker_agents.outputs.renew_after_seconds }}"
          remaining=$(( lifetime - renew_after ))
          echo "Successor dispatched; keeping current demo alive for ${remaining}s handoff/reset window."
          sleep "$remaining"
