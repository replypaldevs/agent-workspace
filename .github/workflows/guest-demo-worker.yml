name: Guest Demo Worker

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: OpenSSH public key authorized for runner access
        required: true
        type: string
      lolgames_ssh_name:
        description: Stable lolgames SSH hostname prefix
        required: false
        type: string
      lolgames_ssh_port:
        description: Stable lolgames SSH public port
        required: false
        type: string
      lolgames_tunnel_prefix:
        description: Stable Worker Agents lolgames prefix
        required: false
        type: string
      demo_lifetime_seconds:
        description: Demo worker lifetime in seconds. Default 18000 (5h).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: guest-demo-worker-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guest-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start SSH over lolgames
        id: lolgames_ssh
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server tmux

          mkdir -p ~/.ssh /tmp/lolgames-ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ inputs.ssh_public_key }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=no -o PermitRootLogin=no -o PubkeyAuthentication=yes

          for _ in {1..20}; do
            if ss -ltn | grep -q ':2222 '; then
              break
            fi
            sleep 1
          done
          ss -ltn | grep -q ':2222 '

          PUBLIC_NAME="${{ inputs.lolgames_ssh_name }}"
          if [[ -z "$PUBLIC_NAME" ]]; then
            PUBLIC_NAME="guest-demo-${GITHUB_RUN_ID}-ssh"
          fi

          PUBLIC_PORT="${{ inputs.lolgames_ssh_port }}"
          if [[ -z "$PUBLIC_PORT" ]]; then
            PUBLIC_PORT="$((30000 + (GITHUB_RUN_ID % 20000)))"
          fi

          TUNNEL_PREFIX="${{ inputs.lolgames_tunnel_prefix }}"
          if [[ -z "$TUNNEL_PREFIX" ]]; then
            TUNNEL_PREFIX="${PUBLIC_NAME%-ssh}"
          fi

          nohup python3 scripts/lolgames_tunnel.py client 127.0.0.1:2222 \
            --server 161.153.109.33 \
            --name "$PUBLIC_NAME" \
            --public-port "$PUBLIC_PORT" \
            > /tmp/lolgames-ssh/tunnel.log 2>&1 &
          TUNNEL_PID=$!

          for _ in {1..30}; do
            if grep -q "lolgames.net" /tmp/lolgames-ssh/tunnel.log; then
              break
            fi
            sleep 1
          done
          grep -q "lolgames.net" /tmp/lolgames-ssh/tunnel.log

          HOST="${PUBLIC_NAME}.lolgames.net"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ./id_ed25519 -p ${PUBLIC_PORT} runner@${HOST}"
          WEB_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "$SSH_CMD"
            echo "$WEB_URL"
            echo "host=$HOST"
            echo "port=$PUBLIC_PORT"
            echo "lolgames_tunnel_prefix=$TUNNEL_PREFIX"
          } > /tmp/ssh-link.txt

          {
            echo "host=$HOST"
            echo "port=$PUBLIC_PORT"
            echo "lolgames_tunnel_prefix=$TUNNEL_PREFIX"
            echo "ssh_target=runner@${HOST}:${PUBLIC_PORT}"
            echo "sshd_ready=yes"
            echo "runner_name=$(hostname)"
            echo "tunnel_pid=$TUNNEL_PID"
            echo "tunnel_log_tail<<EOF"
            tail -n 20 /tmp/lolgames-ssh/tunnel.log || true
            echo "EOF"
          } > /tmp/ssh-status.txt

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PUBLIC_PORT" >> "$GITHUB_OUTPUT"
          echo "public_name=$PUBLIC_NAME" >> "$GITHUB_OUTPUT"
          echo "lolgames_tunnel_prefix=$TUNNEL_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Upload SSH link as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-link
          path: /tmp/ssh-link.txt
          if-no-files-found: error

      - name: Upload SSH status artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-status
          path: /tmp/ssh-status.txt
          if-no-files-found: error

      - name: Start Worker Agents demo
        id: worker_agents
        shell: bash
        run: |
          set -euo pipefail

          APP_PORT=1456
          TUNNEL_PREFIX="${{ steps.lolgames_ssh.outputs.lolgames_tunnel_prefix }}"
          LIFETIME="${{ inputs.demo_lifetime_seconds }}"
          if [[ -z "$LIFETIME" ]]; then
            LIFETIME=18000
          fi
          export APP_PORT
          export LOLGAMES_TUNNEL_PREFIX="$TUNNEL_PREFIX"
          export WORKER_APP_SOURCE_DIR="$GITHUB_WORKSPACE/workerAgents"
          export TUNNEL_CLIENT_PATH="$GITHUB_WORKSPACE/scripts/lolgames_tunnel.py"
          export START_CHILD_AGENTS=0
          export INSTALL_CHILD_DEPS=0
          export PUBLISH_CHILD_AGENT_PORTS=0
          export PROVISION_TRACE=1
          export RUN_TOKEN="guest-demo"
          bash "$GITHUB_WORKSPACE/scripts/provision-worker-runtime.sh" | tee /tmp/worker-provision.log

          STATE_JSON="$HOME/.worker-agents/state.json"
          test -f "$STATE_JSON"
          WORKER_URL="$(python3 - "$STATE_JSON" <<'PY'
          import json, sys
          print((json.load(open(sys.argv[1], encoding='utf-8')).get('worker_agents_url') or '').strip())
          PY
          )"
          if [[ -z "$WORKER_URL" ]]; then
            echo "Guest demo worker URL missing after provision" >&2
            exit 1
          fi
          cp "$STATE_JSON" /tmp/guest-demo-metadata.json

          echo "worker_agents_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "demo_lifetime_seconds=$LIFETIME" >> "$GITHUB_OUTPUT"
          echo "Guest demo Worker Agents: $WORKER_URL"

      - name: Upload guest demo metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-demo-metadata
          path: /tmp/guest-demo-metadata.json
          if-no-files-found: error

      - name: Keep guest demo alive until reset
        shell: bash
        run: |
          set -euo pipefail
          lifetime="${{ steps.worker_agents.outputs.demo_lifetime_seconds }}"
          echo "Keeping guest demo alive for ${lifetime}s until reset."
          sleep "$lifetime"
