name: Guest Demo Watchdog

on:
  schedule:
    # GitHub Actions schedules are best-effort; stay off the top of the hour.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: guest-demo-watchdog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the live guest resolver
        id: guest
        shell: bash
        run: |
          set -euo pipefail
          resolver='https://agentsweb.space/api/last-worker?repo=alexcheng-dev%2Fagent-workspace&refresh=1'
          payload="$(curl --fail --retry 2 --retry-delay 2 --max-time 20 "$resolver")"
          echo "$payload"
          ready="$(jq -r 'select(.readiness == "app_ready" and (.url | type == "string") and (.url | length > 0)) | .url // empty' <<<"$payload")"
          if [[ -n "$ready" ]]; then
            echo "Healthy guest already registered: $ready"
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Re-check and dispatch only when still absent
        if: steps.guest.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resolver='https://agentsweb.space/api/last-worker?repo=alexcheng-dev%2Fagent-workspace&refresh=1'
          payload="$(curl --fail --retry 2 --retry-delay 2 --max-time 20 "$resolver")"
          ready="$(jq -r 'select(.readiness == "app_ready" and (.url | type == "string") and (.url | length > 0)) | .url // empty' <<<"$payload")"
          if [[ -n "$ready" ]]; then
            echo "Guest recovered during watchdog check: $ready"
            exit 0
          fi
          curl --fail-with-body --retry 2 --retry-delay 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/guest-demo-worker.yml/dispatches" \
            -d '{"ref":"main","inputs":{"demo_lifetime_seconds":"18000"}}'
          echo 'Dispatched a recovery guest worker.'
